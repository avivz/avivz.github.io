# Photo gallery source configuration.
#
# Each entry generates one gallery page at /photography/<slug>/.
# To publish photos: add an entry below, then run
#     uv run scripts/build_galleries.py
#
# Fields per entry:
#   slug       (required) URL-safe id, becomes /photography/<slug>/
#   dir        (required) Subdirectory name OR list of subdirs under source_dir.
#                         Multiple dirs are merged into one gallery, sorted by
#                         EXIF date. Filenames must not collide.
#   title      (required) Section title and card label
#   location   (optional) Shown in the lightbox caption
#   thumb      (optional) Filename to use as the cover thumb (e.g. DSC_1234.jpg).
#                         Defaults to the first photo.
#   exclude    (optional) Filenames to skip (and prune from /photos/)
#
# Example with all fields:
#   - slug: pole-farm
#     dir:
#       - Nov_2025_PoleFarm2
#       - Dec_2025_PoleFarm3
#       - Dec_2025_PoleFarm4
#     title: Pole Farm
#     location: Mercer Meadows, NJ
#     thumb: DSC_4321.jpg
#     exclude:
#       - DSC_1234.jpg

